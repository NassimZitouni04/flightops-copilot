[project]
name = "flightops-copilot"
version = "0.1.0"
description = "RAG agent for drone operators, built on FAA Part 107 and PX4 documentation with live weather and airspace tools."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "anthropic>=2.6,<3",
  "fastapi>=0.115",
  "fastembed>=0.9,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2,<2",
  "mcp>=2.3,<3",
  "numpy>=2",
  "pydantic>=2",
  "python-dotenv>=1",
  "rank-bm25>=0.2.2",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flightops = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
