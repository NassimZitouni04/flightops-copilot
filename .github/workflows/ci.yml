name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  retrieval-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: .cache
          key: retrieval-${{ hashFiles('data/corpus.jsonl') }}
      - name: Fail if search quality drops below the gate
        run: python evals/retrieval_eval.py --gate
        env:
          FASTEMBED_CACHE_PATH: .cache/fastembed
